[project]
name = "backend"
version = "0.1.0"
description = "基于 FastAPI 与 Agent 工作流的旅行助手后端"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiomysql>=0.3.2",
    "argon2-cffi>=25.1.0",
    "email-validator>=2.3.0",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "langchain>=1.4.3",
    "langchain-deepseek>=1.1.1",
    "langgraph>=1.2.14",
    "loguru>=0.7.3",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "sqlalchemy[asyncio]>=2.1.3",
    "uvicorn[standard]>=0.54.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--ignore=tests/integration"
